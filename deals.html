<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deals · Stratt HQ</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12253D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stratt HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<div id="app"></div>
<script>
HQ.boot('deals', async function (ctx) {
  var H = HQ, sb = ctx.sb, per = ctx.per, sum = H.sum, aed = H.aed;
  var STATUS = { open: ['Open', ''], received: ['Received', 'success'], under_review: ['Under review', 'warning'], cancelled: ['Cancelled', 'danger'] };
  var all = (await sb.from('deals').select('*').order('received_on', { ascending: false, nullsFirst: false })).data || [];
  var recv = all.filter(function (d) { return d.status === 'received' && H.within(d.received_on, per); });
  var rows = all.filter(function (d) { return d.status === 'received' ? H.within(d.received_on, per) : (per.all || H.within(d.created_at, per)); }).filter(function (d) { return H.matches(d, ctx.q); });
  var got = sum(recv.map(function (d) { return d.commission_aed; }));
  var largest = recv.reduce(function (a, d) { return !a || Number(d.commission_aed) > Number(a.commission_aed) ? d : a; }, null);
  var review = all.filter(function (d) { return d.status === 'under_review'; });
  var by = {};
  recv.forEach(function (d) { by[d.name] = (by[d.name] || 0) + Number(d.commission_aed); });
  return [
    H.pageHead(ctx, { eyebrow: 'Sales', title: 'Deals and commissions', sub: 'Commission received and claims under review. Marking a deal received adds it to Finance automatically.',
      action: ctx.canEdit && H.addButton(ctx, { table: 'deals', label: 'Record deal', fields: [
        { name: 'name', label: 'Deal or project', required: true },
        { name: 'developer', label: 'Developer' },
        { name: 'value_aed', label: 'Deal value in AED', type: 'number' },
        { name: 'commission_aed', label: 'Commission in AED', type: 'number', required: true },
        { name: 'status', label: 'Status', type: 'select', required: true, options: [['received', 'Received'], ['open', 'Open'], ['under_review', 'Under review']] },
        { name: 'received_on', label: 'Received on', type: 'date' }
      ] }) }),
    H.kpis([
      { label: 'Commission received', value: aed(got), note: per.label },
      { label: 'Payments', value: String(recv.length), note: recv.length ? 'Average ' + aed(Math.round(got / recv.length)) : 'None in this period' },
      { label: 'Largest payment', value: largest ? aed(largest.commission_aed) : '–', note: largest ? largest.name : per.label },
      { label: 'Claims under review', value: aed(sum(review.map(function (d) { return d.commission_aed; }))), note: review.length + ' deals', tone: review.length ? 'down' : '' }
    ]),
    H.row(
      H.table({ title: 'Deals', note: rows.length + ' deals', rows: rows, empty: 'No deals in ' + per.label + '.', columns: [
        { key: 'name', label: 'Deal', render: function (r) { return H.cell(r.name, r.developer); } },
        { key: 'received_on', label: 'Received', render: function (r) { return H.fmtDate(r.received_on); } },
        { key: 'commission_aed', label: 'Commission', num: 1, render: function (r) { return aed(r.commission_aed); } },
        { key: 'status', label: 'Status', render: function (r) { var x = STATUS[r.status] || [r.status, '']; return H.badge(x[0], x[1]); } }
      ].concat(ctx.canEdit ? [{ key: 'x', label: 'Action', render: function (r) { return r.status !== 'received' && r.status !== 'cancelled' ? H.rowAction(ctx, { table: 'deals', id: r.id, patch: { status: 'received', received_on: r.received_on || H.today() }, label: 'Mark received' }) : null; } }] : []) }),
      H.side({ title: 'By source', note: per.label, empty: 'No commission in this period.', items: Object.entries(by).sort(function (a, b) { return b[1] - a[1]; }).map(function (e, i) { return { label: e[0], value: aed(e[1]), pct: got ? Math.round(e[1] / got * 100) : 0, wood: i > 2 }; }) }))
  ];
});
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
