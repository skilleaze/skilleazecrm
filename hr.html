<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR and payroll · Stratt HQ</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12253D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stratt HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
var LATE = (HQ.config.lateAfter || '09:15');
var pad = function (n) { return String(n).padStart(2, '0'); };
function normDate(s) {
  s = String(s || '').trim();
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if (m) return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);
  return null;
}
function normTime(s) {
  var m = String(s || '').trim().match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?/i);
  if (!m) return null;
  var hr = +m[1], ap = (m[3] || '').toLowerCase();
  if (ap === 'pm' && hr < 12) hr += 12;
  if (ap === 'am' && hr === 12) hr = 0;
  return pad(hr) + ':' + m[2];
}
function parseCSV(text) {
  var lines = text.replace(/\r/g, '').split('\n').filter(function (l) { return l.trim(); });
  if (!lines.length) return [];
  var f = lines[0], sep = (f.match(/;/g) || []).length > (f.match(/,/g) || []).length ? ';' : (f.indexOf('\t') >= 0 ? '\t' : ',');
  var rows = lines.map(function (l) { return l.split(sep).map(function (c) { return c.trim().replace(/^"|"$/g, ''); }); });
  var head = rows[0].map(function (x) { return x.toLowerCase(); }), idx = { code: 0, date: 1, inn: 2, out: 3 };
  if (!normDate(rows[0][1]) && head.some(function (x) { return /code|id|date|name|in|out/.test(x); })) {
    var find = function (re, not) { return head.findIndex(function (x, i) { return re.test(x) && not.indexOf(i) < 0; }); };
    var out = find(/out/, []), date = find(/date|day/, [out]), inn = find(/in/, [out, date]), code = find(/code|id|employee|name|staff/, [out, date, inn]);
    idx = { code: code < 0 ? 0 : code, date: date < 0 ? 1 : date, inn: inn < 0 ? 2 : inn, out: out < 0 ? 3 : out };
    rows = rows.slice(1);
  }
  return rows.map(function (r) { return { code: r[idx.code], date: normDate(r[idx.date]), inn: normTime(r[idx.inn]), out: normTime(r[idx.out]) }; }).filter(function (r) { return r.code && r.date; });
}
function importDialog(ctx, emps) {
  var H = HQ, h = H.h;
  H.dialog(function (close) {
    var rows = [], msg = h('div', { role: 'status' }), preview = h('div');
    var go = h('button', { type: 'button', class: 'btn', disabled: true }, 'Import records');
    var file = h('input', { type: 'file', accept: '.csv,text/csv,.txt', onchange: async function (e) {
      msg.textContent = ''; msg.className = '';
      var fl = e.target.files[0]; if (!fl) return;
      rows = parseCSV(await fl.text());
      go.disabled = !rows.length; go.textContent = 'Import ' + rows.length + ' records';
      preview.replaceChildren(rows.length ? h('div', null, h('div', { class: 'muted', style: { marginBottom: '8px' } }, rows.length + ' rows ready. First ' + Math.min(8, rows.length) + ' shown.'),
        H.table({ rows: rows.slice(0, 8), columns: [{ key: 'code', label: 'Employee' }, { key: 'date', label: 'Date' }, { key: 'inn', label: 'Punch in' }, { key: 'out', label: 'Punch out' }] })) : '');
      if (!rows.length) { msg.className = 'error'; msg.textContent = 'No rows found. The file needs employee code, date, punch in and punch out columns.'; }
    } });
    go.addEventListener('click', async function () {
      go.disabled = true; go.textContent = 'Importing…';
      var key = function (x) { return String(x || '').trim().toLowerCase(); }, byCode = {}, byName = {};
      emps.forEach(function (e) { if (e.portal_code) byCode[key(e.portal_code)] = e.id; byName[key(e.full_name)] = e.id; });
      var recs = {}, unmatched = {}, now = new Date().toISOString();
      rows.forEach(function (r) {
        var id = byCode[key(r.code)] || byName[key(r.code)];
        if (!id) { unmatched[r.code] = 1; return; }
        recs[id + r.date] = { employee_id: id, work_date: r.date, punch_in: r.inn, punch_out: r.out, source: 'portal_import', imported_at: now };
      });
      var list = Object.values(recs), miss = Object.keys(unmatched);
      for (var i = 0; i < list.length; i += 500) {
        var res = await ctx.sb.from('attendance').upsert(list.slice(i, i + 500), { onConflict: 'employee_id,work_date' });
        if (res.error) { msg.className = 'error'; msg.textContent = res.error.message; go.disabled = false; go.textContent = 'Try again'; return; }
      }
      msg.className = 'ok';
      msg.textContent = list.length + ' records imported.' + (miss.length ? ' Not matched: ' + miss.slice(0, 20).join(', ') + '. Add their portal code under Team.' : '');
      go.textContent = 'Done';
      await ctx.refresh();
    });
    return [
      h('h2', null, 'Import attendance'),
      h('div', { class: 'sub' }, 'Upload the CSV export from your attendance portal with columns for employee code, date, punch in and punch out. Rows match the portal code on each team member, or their full name. Re-importing a day replaces it.'),
      h('label', { class: 'form-field' }, 'CSV file', file), preview, msg,
      h('div', { class: 'dialog-actions' }, h('button', { type: 'button', class: 'btn ghost', onclick: close }, 'Close'), go)
    ];
  }, true);
}

HQ.boot('hr', async function (ctx) {
  var H = HQ, h = H.h, sb = ctx.sb, per = ctx.per, sum = H.sum, aed = H.aed, q = ctx.q, canEdit = ctx.canEdit;
  var TABS = [['team', 'Team'], ['attendance', 'Attendance'], ['payroll', 'Payroll']];
  var TONE = { active: 'success', left: '', settlement_pending: 'warning' };
  var tab = TABS.some(function (t) { return t[0] === ctx.tab; }) ? ctx.tab : 'team';
  var res = await Promise.all([
    sb.from('employees').select('*').order('full_name'),
    sb.from('payroll').select('*, employees(full_name)').order('month', { ascending: false }),
    tab === 'attendance' ? H.inPeriod(sb.from('attendance').select('*, employees(full_name)'), 'work_date', per).order('work_date', { ascending: false }).limit(5000) : Promise.resolve({ data: [] })
  ]);
  var emps = res[0].data || [], pay = res[1].data || [], att = res[2].data || [];
  var payP = pay.filter(function (p) { return H.within(p.month, per); });
  var paid = function (rows) { return rows.filter(function (p) { return p.status !== 'owed'; }); };
  var salP = sum(paid(payP).map(function (p) { return p.amount_aed; }));
  var kp, body, action = null, sub;

  if (tab === 'team') {
    sub = 'Everyone on the team, with their latest salary.';
    var rows = emps.map(function (e) { var mine = paid(pay.filter(function (p) { return p.employee_id === e.id; })); return Object.assign({}, e, { latest: mine[0], count: mine.length }); }).filter(function (r) { return H.matches(r, q); });
    kp = [
      { label: 'Active team', value: String(emps.filter(function (e) { return e.status === 'active'; }).length), note: emps.length + ' on file' },
      { label: 'Salaries paid', value: aed(salP), note: per.label },
      { label: 'People paid', value: String(new Set(paid(payP).map(function (p) { return p.employee_id; })).size), note: per.label },
      { label: 'Settlements pending', value: String(emps.filter(function (e) { return e.status === 'settlement_pending'; }).length), note: 'Leavers to settle' }
    ];
    if (canEdit) action = H.addButton(ctx, { table: 'employees', label: 'Add team member', fields: [
      { name: 'full_name', label: 'Full name', required: true },
      { name: 'position', label: 'Position' },
      { name: 'portal_code', label: 'Attendance portal code' },
      { name: 'basic_salary_aed', label: 'Monthly salary in AED', type: 'number' },
      { name: 'joined_on', label: 'Joined on', type: 'date' },
      { name: 'status', label: 'Status', type: 'select', required: true, options: [['active', 'Active'], ['left', 'Left'], ['settlement_pending', 'Settlement pending']] }
    ] });
    body = H.table({ title: 'Team', note: rows.length + ' people', rows: rows, columns: [
      { key: 'full_name', label: 'Name', render: function (r) { return H.cell(r.full_name, r.position); } },
      { key: 'portal_code', label: 'Portal code', render: function (r) {
        if (!canEdit) return r.portal_code || '–';
        return h('button', { type: 'button', class: 'btn sm ghost', onclick: async function () {
          var v = window.prompt('Attendance portal code for ' + r.full_name, r.portal_code || '');
          if (v === null) return;
          var x = await sb.from('employees').update({ portal_code: v.trim() || null }).eq('id', r.id);
          if (x.error) H.toast(x.error.message, true); else { await ctx.refresh(); H.toast('Portal code saved'); }
        } }, r.portal_code || 'Set code');
      } },
      { key: 'latest', label: 'Latest salary', num: 1, render: function (r) { return r.latest ? aed(r.latest.amount_aed) : r.basic_salary_aed ? aed(r.basic_salary_aed) : '–'; } },
      { key: 'last', label: 'Last paid', render: function (r) { return r.latest ? H.monthLabel(r.latest.month) : '–'; } },
      { key: 'count', label: 'Months paid', num: 1, render: function (r) { return String(r.count); } },
      { key: 'status', label: 'Status', render: function (r) { return H.badge(H.label(r.status), TONE[r.status]); } }
    ] });
  }

  if (tab === 'attendance') {
    sub = 'Punch in and punch out records imported from the attendance portal. Late after ' + LATE + '.';
    var st = function (r) {
      var i = r.punch_in ? r.punch_in.slice(0, 5) : null, o = r.punch_out ? r.punch_out.slice(0, 5) : null;
      if (!i) return ['No punch in', 'danger'];
      if (!o) return ['Missing punch out', 'warning'];
      if (i > LATE) return ['Late', 'warning'];
      return ['On time', 'success'];
    };
    var ar = att.map(function (r) { return Object.assign({}, r, { name: r.employees ? r.employees.full_name : '–', st: st(r) }); }).filter(function (r) { return H.matches(r, q); });
    var count = function (x) { return ar.filter(function (r) { return r.st[0] === x; }).length; };
    var done = ar.filter(function (r) { return r.hours != null; });
    kp = [
      { label: 'Records', value: String(ar.length), note: per.label },
      { label: 'On time', value: String(count('On time')), note: 'In by ' + LATE, tone: 'up' },
      { label: 'Late arrivals', value: String(count('Late')), note: 'After ' + LATE, tone: count('Late') ? 'down' : '' },
      { label: 'Incomplete', value: String(count('Missing punch out') + count('No punch in')), note: 'Missing a punch', tone: 'down' }
    ];
    if (canEdit) action = h('button', { type: 'button', class: 'btn', onclick: function () { importDialog(ctx, emps); } }, H.icon('upload'), 'Import attendance');
    var hrs = function (x) { return x == null ? '–' : Math.floor(x) + 'h ' + Math.round((x % 1) * 60) + 'm'; };
    body = H.row(
      H.table({ title: 'Punch records', note: ar.length + ' records', rows: ar, empty: 'No punch records for this period. Use Import attendance to upload the export from your portal.', columns: [
        { key: 'name', label: 'Employee', render: function (r) { return H.bold(r.name); } },
        { key: 'work_date', label: 'Date', render: function (r) { return H.fmtDate(r.work_date); } },
        { key: 'punch_in', label: 'Punch in', render: function (r) { return r.punch_in ? r.punch_in.slice(0, 5) : '–'; } },
        { key: 'punch_out', label: 'Punch out', render: function (r) { return r.punch_out ? r.punch_out.slice(0, 5) : '–'; } },
        { key: 'hours', label: 'Hours', num: 1, render: function (r) { return hrs(r.hours); } },
        { key: 'st', label: 'Status', render: function (r) { return H.badge(r.st[0], r.st[1]); } }
      ] }),
      H.side({ title: 'Summary', items: [
        { label: 'Average hours worked', value: done.length ? (sum(done.map(function (r) { return r.hours; })) / done.length).toFixed(1) + ' h' : '–', sub: 'Across complete records' },
        { label: 'Late after', value: LATE, sub: 'Change lateAfter in assets/config.js to match your policy.' },
        { label: 'Source', value: 'Attendance portal', sub: 'CSV export uploaded by HR' }
      ] }));
  }

  if (tab === 'payroll') {
    sub = 'Salaries by person and month.';
    var pr = payP.map(function (p) { return Object.assign({}, p, { name: p.employees ? p.employees.full_name : '–' }); }).filter(function (r) { return H.matches(r, q); });
    var owed = sum(pay.filter(function (p) { return p.status === 'owed'; }).map(function (p) { return p.amount_aed; }));
    kp = [
      { label: 'Salaries paid', value: aed(salP), note: per.label },
      { label: 'People paid', value: String(new Set(paid(payP).map(function (p) { return p.employee_id; })).size), note: per.label },
      { label: 'Average salary', value: payP.length ? aed(Math.round(salP / payP.length)) : '–', note: 'Per payment' },
      { label: 'Salaries owed', value: aed(owed), note: 'Marked as owed', tone: owed ? 'down' : '' }
    ];
    if (canEdit) action = H.addButton(ctx, { table: 'payroll', label: 'Add salary', fields: [
      { name: 'employee_id', label: 'Employee', type: 'select', required: true, options: emps.map(function (e) { return [e.id, e.full_name]; }) },
      { name: 'month', label: 'Month', type: 'month', required: true },
      { name: 'amount_aed', label: 'Amount in AED', type: 'number', required: true },
      { name: 'status', label: 'Status', type: 'select', required: true, options: [['paid', 'Paid'], ['owed', 'Owed'], ['draft', 'Draft']] },
      { name: 'paid_on', label: 'Paid on', type: 'date' }
    ] });
    body = H.table({ title: 'Salaries', note: pr.length + ' payments', rows: pr, empty: 'No salaries recorded for ' + per.label + '.', columns: [
      { key: 'name', label: 'Employee', render: function (r) { return H.bold(r.name); } },
      { key: 'month', label: 'Month', render: function (r) { return H.monthLabel(r.month); } },
      { key: 'amount_aed', label: 'Salary', num: 1, render: function (r) { return aed(r.amount_aed); } },
      { key: 'status', label: 'Status', render: function (r) { return H.badge(H.label(r.status), r.status === 'paid' ? 'success' : r.status === 'owed' ? 'danger' : ''); } }
    ].concat(canEdit ? [{ key: 'x', label: 'Action', render: function (r) { return r.status !== 'paid' ? H.rowAction(ctx, { table: 'payroll', id: r.id, patch: { status: 'paid', paid_on: H.today() }, label: 'Mark paid' }) : null; } }] : []) });
  }

  return [
    H.pageHead(ctx, { eyebrow: 'People', title: 'HR and payroll', sub: sub, keep: { tab: tab }, action: action }),
    H.tabs(ctx, TABS, tab, 'hr.html'),
    H.kpis(kp),
    body
  ];
});
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
