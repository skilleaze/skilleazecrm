<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads · Stratt HQ</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12253D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stratt HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<div id="app"></div>
<script>
HQ.boot('leads', async function (ctx) {
  var H = HQ, h = H.h, sb = ctx.sb, per = ctx.per, sum = H.sum, aed = H.aed;
  var STAGES = [['new', 'New'], ['contacted', 'Contacted'], ['viewing', 'Viewing'], ['offer', 'Offer'], ['won', 'Won']];
  var SOURCES = ['bayut', 'dubizzle', 'property_finder', 'website', 'instagram', 'referral', 'walk_in', 'other'];
  var all = ((await H.inPeriod(sb.from('leads').select('*'), 'created_at', per).order('created_at', { ascending: false })).data || []).filter(function (r) { return H.matches(r, ctx.q); });
  var open = all.filter(function (r) { return r.stage !== 'won' && r.stage !== 'lost'; });
  var cnt = function (st) { return all.filter(function (r) { return r.stage === st; }).length; };
  return [
    H.pageHead(ctx, { eyebrow: 'CRM', title: 'Leads and pipeline', sub: 'Every enquiry from portals, social and referrals, by stage.',
      action: ctx.canEdit && H.addButton(ctx, { table: 'leads', label: 'Add lead', defaults: { agent_id: ctx.user.id }, fields: [
        { name: 'full_name', label: 'Full name', required: true },
        { name: 'phone', label: 'Phone' },
        { name: 'email', label: 'Email', type: 'email' },
        { name: 'source', label: 'Source', type: 'select', options: SOURCES.map(function (x) { return [x, H.label(x)]; }) },
        { name: 'budget_aed', label: 'Budget in AED', type: 'number' },
        { name: 'notes', label: 'Looking for', type: 'textarea' }
      ] }) }),
    H.kpis([
      { label: 'Open leads', value: String(open.length), note: per.label },
      { label: 'New', value: String(cnt('new')), note: 'Awaiting first contact', tone: cnt('new') ? 'down' : '' },
      { label: 'Won', value: String(cnt('won')), note: per.label, tone: 'up' },
      { label: 'Pipeline budget', value: aed(sum(open.map(function (r) { return r.budget_aed; }))), note: 'Open leads' }
    ]),
    h('div', { class: 'kanban' }, STAGES.map(function (stg, i) {
      var items = all.filter(function (r) { return r.stage === stg[0]; });
      return h('div', { class: 'stage' },
        h('div', { class: 'stage-head' }, H.bold(stg[1]), h('span', { class: 'badge' }, items.length + ' · ' + H.aedShort(sum(items.map(function (r) { return r.budget_aed; }))))),
        items.length ? items.map(function (r) {
          return h('div', { class: 'card lead' },
            h('div', { class: 'h', style: { fontWeight: 600 } }, r.full_name),
            r.notes ? h('div', { class: 'muted', style: { fontSize: '14px' } }, r.notes) : null,
            h('div', { style: { display: 'flex', justifyContent: 'space-between', gap: '8px', flexWrap: 'wrap' } }, H.bold(r.budget_aed ? aed(r.budget_aed) : '–'), h('span', { class: 'muted', style: { color: '#6C5235' } }, H.label(r.source))),
            r.phone ? h('a', { href: 'tel:' + r.phone, class: 'muted' }, r.phone) : null,
            ctx.canEdit && i < STAGES.length - 1 ? H.rowAction(ctx, { table: 'leads', id: r.id, patch: { stage: STAGES[i + 1][0] }, label: 'Move to ' + STAGES[i + 1][1].toLowerCase() }) : null,
            ctx.canEdit && stg[0] !== 'won' ? H.rowAction(ctx, { table: 'leads', id: r.id, patch: { stage: 'lost' }, label: 'Mark lost', confirm: 'Mark this lead as lost?' }) : null);
        }) : h('div', { class: 'muted', style: { padding: '8px 4px' } }, 'No leads'));
    }))
  ];
});
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
