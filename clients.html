<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients · Stratt HQ</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12253D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stratt HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<div id="app"></div>
<script>
HQ.boot('clients', async function (ctx) {
  var H = HQ, sb = ctx.sb, per = ctx.per;
  var KINDS = ['buyer', 'seller', 'owner', 'tenant', 'investor'];
  var all = (await H.inPeriod(sb.from('clients').select('*'), 'created_at', per).order('created_at', { ascending: false })).data || [];
  var rows = all.filter(function (r) { return H.matches(r, ctx.q); });
  var n = function (k) { return all.filter(function (r) { return r.kind === k; }).length; };
  return [
    H.pageHead(ctx, { eyebrow: 'Relationships', title: 'Clients and owners', sub: 'Buyers, sellers, tenants, owners and investors.',
      action: ctx.canEdit && H.addButton(ctx, { table: 'clients', label: 'Add client', defaults: { owner_id: ctx.user.id }, fields: [
        { name: 'full_name', label: 'Full name', required: true },
        { name: 'kind', label: 'Type', type: 'select', required: true, options: KINDS.map(function (k) { return [k, H.label(k)]; }) },
        { name: 'phone', label: 'Phone' },
        { name: 'email', label: 'Email', type: 'email' },
        { name: 'nationality', label: 'Nationality' },
        { name: 'notes', label: 'Notes', type: 'textarea' }
      ] }) }),
    H.kpis([
      { label: 'Contacts', value: String(all.length), note: per.label },
      { label: 'Buyers', value: String(n('buyer')), note: 'And ' + n('investor') + ' investors' },
      { label: 'Owners and sellers', value: String(n('owner') + n('seller')), note: per.label },
      { label: 'Tenants', value: String(n('tenant')), note: per.label }
    ]),
    H.table({ title: 'Directory', note: rows.length + ' contacts', rows: rows, empty: 'No clients yet.', columns: [
      { key: 'full_name', label: 'Client', render: function (r) { return H.cell(r.full_name, r.email); } },
      { key: 'kind', label: 'Type', render: function (r) { return H.badge(H.label(r.kind)); } },
      { key: 'phone', label: 'Phone' },
      { key: 'nationality', label: 'Nationality' },
      { key: 'created_at', label: 'Added', render: function (r) { return H.fmtDate(r.created_at); } }
    ] })
  ];
});
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
