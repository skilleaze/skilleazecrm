<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Stratt HQ</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12253D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stratt HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<div id="app"></div>
<script>
HQ.boot('settings', async function (ctx) {
  var H = HQ, h = H.h, sb = ctx.sb, level = ctx.level, me = ctx.user.id;
  var ROLES = ['ceo', 'admin', 'finance', 'hr', 'sales', 'marketing', 'agent'];
  var MODS = H.MODULES.map(function (m) { return [m.id, m.label]; });
  var res = await Promise.all([
    sb.from('profiles').select('id, full_name, email, access_level, active, role').order('full_name'),
    sb.from('module_permissions').select('*'),
    sb.from('staff_access').select('*').order('email')
  ]);
  var people = res[0].data || [], perms = res[1].data || [], invites = res[2].data || [];
  var emails = {};
  people.forEach(function (p) { emails[p.email.toLowerCase()] = 1; });
  var pending = invites.filter(function (i) { return !emails[i.email.toLowerCase()]; });
  var levels = level === 'super_admin' ? [['user', 'User'], ['admin', 'Admin'], ['super_admin', 'Super admin']] : [['user', 'User']];
  var canManage = function (u) { return u.id !== me && (level === 'super_admin' || (level === 'admin' && u.access_level === 'user')); };
  var err = h('div', { class: 'error', style: { padding: '0 24px' }, role: 'alert' });
  var run = async function (p) { err.textContent = ''; var r = await p; if (r.error) { err.textContent = r.error.message; H.toast(r.error.message, true); } else { await ctx.refresh(); H.toast('Access updated'); } };
  var permsOf = function (u) { var o = {}; perms.filter(function (x) { return x.profile_id === u.id; }).forEach(function (x) { o[x.module] = x; }); return o; };

  var userRow = function (u) {
    var sa = u.access_level === 'super_admin', mine = permsOf(u);
    var granted = H.MODULES.filter(function (m) { return mine[m.id]; });
    var summary = sa ? 'Full access to every module' : granted.length ? granted.map(function (m) { return m.label + (mine[m.id].can_edit ? ' (edit)' : ''); }).join(', ') : 'No modules yet';
    var grid = h('div', { class: 'perm-grid', style: { display: 'none' } }, H.MODULES.map(function (m) {
      var p = mine[m.id] || {};
      var set = function (view, edit) {
        if (!view && !edit) return run(sb.from('module_permissions').delete().eq('profile_id', u.id).eq('module', m.id));
        return run(sb.from('module_permissions').upsert({ profile_id: u.id, module: m.id, can_view: true, can_edit: !!edit }, { onConflict: 'profile_id,module' }));
      };
      return h('div', { class: 'perm' }, h('span', null, m.label),
        h('label', null, h('input', { type: 'checkbox', checked: !!(p.can_view || p.can_edit), onchange: function (e) { set(e.target.checked, e.target.checked && p.can_edit); } }), 'View'),
        h('label', null, h('input', { type: 'checkbox', checked: !!p.can_edit, onchange: function (e) { set(true, e.target.checked); } }), 'Edit'));
    }));
    var lvl = h('select', { class: 'field', 'aria-label': 'Access level', disabled: level !== 'super_admin' || u.id === me, onchange: function (e) { run(sb.from('profiles').update({ access_level: e.target.value }).eq('id', u.id)); } },
      [['super_admin', 'Super admin'], ['admin', 'Admin'], ['user', 'User']].map(function (o) { return h('option', { value: o[0] }, o[1]); }));
    lvl.value = u.access_level;
    Array.prototype.forEach.call(lvl.options, function (o) { o.defaultSelected = o.value === u.access_level; });
    var editBtn = !sa && canManage(u) ? h('button', { type: 'button', class: 'btn sm ghost', onclick: function (e) { var on = grid.style.display === 'none'; grid.style.display = on ? 'grid' : 'none'; e.currentTarget.textContent = on ? 'Done' : 'Edit access'; } }, 'Edit access') : null;
    return h('div', { class: 'user-row' },
      h('div', { class: 'user-top' },
        h('div', { style: { minWidth: 0 } }, h('div', { class: 'h', style: { fontWeight: 700 } }, u.full_name + (u.id === me ? ' (you)' : '')), h('div', { class: 'muted', style: { overflowWrap: 'anywhere' } }, u.email)),
        h('div', { class: 'user-tools' },
          u.active ? null : H.badge('Disabled', 'danger'),
          lvl, editBtn,
          level === 'super_admin' && u.id !== me ? h('button', { type: 'button', class: 'btn sm ghost', onclick: function () { run(sb.from('profiles').update({ active: !u.active }).eq('id', u.id)); } }, u.active ? 'Disable' : 'Enable') : null)),
      h('div', { class: 'muted' }, summary), grid);
  };

  return [
    H.pageHead(ctx, { eyebrow: 'Administration', title: 'Settings and access', period: false, search: false,
      sub: 'Who can sign in, and what each person can see and change. Sign-in is limited to stratt.ae and stratton.ae Google accounts.',
      action: level === 'super_admin' && H.addButton(ctx, { table: 'staff_access', label: 'Invite person', fields: [
        { name: 'email', label: 'Google work email', type: 'email', required: true },
        { name: 'full_name', label: 'Full name' },
        { name: 'role', label: 'Job role', type: 'select', required: true, options: ROLES.map(function (r) { return [r, H.label(r)]; }) },
        { name: 'access_level', label: 'Access level', type: 'select', required: true, options: levels },
        { name: 'view_modules', label: 'Can view', type: 'modules', options: MODS },
        { name: 'edit_modules', label: 'Can view and edit', type: 'modules', options: MODS }
      ] }) }),
    H.kpis([
      { label: 'People', value: String(people.length), note: people.filter(function (p) { return p.active; }).length + ' active' },
      { label: 'Super admins', value: String(people.filter(function (p) { return p.access_level === 'super_admin'; }).length), note: 'Full access' },
      { label: 'Admins', value: String(people.filter(function (p) { return p.access_level === 'admin'; }).length), note: 'Can manage users' },
      { label: 'Pending invitations', value: String(pending.length), note: 'Not signed in yet' }
    ]),
    h('section', { class: 'card' },
      h('div', { class: 'panel-title' }, h('h2', null, 'Users and access'), h('span', { class: 'muted' }, people.length + ' people')),
      err, h('div', { class: 'users' }, people.map(userRow))),
    level === 'super_admin' ? H.table({ title: 'Pending invitations', note: 'Access applies on first Google sign-in', rows: pending, empty: 'No pending invitations.', columns: [
      { key: 'email', label: 'Email', render: function (r) { return H.bold(r.email); } },
      { key: 'access_level', label: 'Level', render: function (r) { return H.badge(H.label(r.access_level)); } },
      { key: 'mods', label: 'Modules', render: function (r) { var e = r.edit_modules || [], v = (r.view_modules || []).filter(function (m) { return e.indexOf(m) < 0; }); return e.length + v.length ? e.map(function (m) { return m + ' (edit)'; }).concat(v).join(', ') : '–'; } },
      { key: 'x', label: 'Action', render: function (r) { return H.rowAction(ctx, { table: 'staff_access', idKey: 'email', id: r.email, remove: true, label: 'Cancel', confirm: 'Cancel this invitation?' }); } }
    ] }) : null
  ];
});
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
