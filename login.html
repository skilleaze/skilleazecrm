<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Stratt HQ</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12253D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stratt HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main class="login">
  <div class="login-card">
    <img src="assets/stratt-logo-navy.png" alt="Stratt Signature">
    <div>
      <h1>Sign in to Stratt HQ</h1>
      <p class="sub" style="margin:8px 0 0">Use your company Google account.</p>
    </div>
    <button type="button" class="gbtn" id="google"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" style="flex:none"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span id="glabel">Sign in with Google</span></button>
    <div class="error" id="msg" role="alert"></div>
    <div class="muted">For Stratt Signature staff only</div>
  </div>
</main>
<script>
(async function () {
  var p = new URLSearchParams(location.search), msg = document.getElementById('msg');
  var err = p.get('error'), desc = (p.get('error_description') || '').toLowerCase();
  if (err === 'domain' || desc.indexOf('database error') >= 0 || desc.indexOf('stratt') >= 0) msg.textContent = 'Use your stratt.ae or stratton.ae Google account.';
  else if (err) msg.textContent = 'Sign-in failed. Please try again.';
  var s = await HQ.sb.auth.getSession();
  if (s.data.session && !err) { location.replace('index.html'); return; }
  document.getElementById('google').addEventListener('click', async function (e) {
    var b = document.getElementById('google'), l = document.getElementById('glabel'); b.disabled = true; l.textContent = 'Opening Google…';
    var base = location.href.replace(/[^/]*$/, '');
    var r = await HQ.sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: base + 'index.html', queryParams: { prompt: 'select_account' } } });
    if (r.error) { msg.textContent = r.error.message; b.disabled = false; l.textContent = 'Sign in with Google'; }
  });
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
