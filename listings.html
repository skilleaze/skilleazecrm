<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listings · Stratt HQ</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12253D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stratt HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<div id="app"></div>
<script>
HQ.boot('listings', async function (ctx) {
  var H = HQ, h = H.h, sb = ctx.sb, per = ctx.per, aed = H.aed;
  var TABS = [['all', 'All'], ['active', 'Active'], ['reserved', 'Reserved'], ['sold', 'Sold'], ['rented', 'Rented'], ['draft', 'Draft']];
  var TONE = { active: 'success', reserved: 'warning', sold: 'navy', rented: 'navy', draft: '', withdrawn: 'danger' };
  var tab = TABS.some(function (t) { return t[0] === ctx.tab; }) ? ctx.tab : 'all';
  var all = (await H.inPeriod(sb.from('listings').select('*'), 'created_at', per).order('created_at', { ascending: false })).data || [];
  var rows = all.filter(function (r) { return (tab === 'all' || r.status === tab) && H.matches(r, ctx.q); });
  var n = function (st) { return all.filter(function (r) { return r.status === st; }).length; };
  return [
    H.pageHead(ctx, { eyebrow: 'Inventory', title: 'Listings', sub: 'Residences and commercial space under mandate.', keep: { tab: tab },
      action: ctx.canEdit && H.addButton(ctx, { table: 'listings', label: 'Add listing', defaults: { agent_id: ctx.user.id }, fields: [
        { name: 'title', label: 'Title', required: true },
        { name: 'ref', label: 'Reference' },
        { name: 'community', label: 'Community' },
        { name: 'developer', label: 'Developer' },
        { name: 'type', label: 'Type', type: 'select', options: ['apartment', 'villa', 'townhouse', 'penthouse', 'plot', 'office'].map(function (t) { return [t, H.label(t)]; }) },
        { name: 'purpose', label: 'Purpose', type: 'select', required: true, options: [['sale', 'Sale'], ['rent', 'Rent'], ['off-plan', 'Off-plan']] },
        { name: 'bedrooms', label: 'Bedrooms', type: 'number' },
        { name: 'size_sqft', label: 'Size in sq ft', type: 'number' },
        { name: 'price_aed', label: 'Price in AED', type: 'number' },
        { name: 'permit_no', label: 'Permit number' },
        { name: 'status', label: 'Status', type: 'select', required: true, options: [['active', 'Active'], ['draft', 'Draft'], ['reserved', 'Reserved']] }
      ] }) }),
    H.tabs(ctx, TABS, tab, 'listings.html'),
    H.kpis([
      { label: 'Active', value: String(n('active')), note: all.length + ' listings' },
      { label: 'Reserved', value: String(n('reserved')), note: per.label },
      { label: 'Sold', value: String(n('sold')), note: per.label },
      { label: 'Awaiting permit', value: String(all.filter(function (r) { return r.status === 'active' && !r.permit_no; }).length), note: 'Active without permit number', tone: 'down' }
    ]),
    rows.length ? h('div', { class: 'grid3' }, rows.map(function (r) {
      var next = { active: ['reserved', 'Mark reserved'], reserved: ['sold', 'Mark sold'], draft: ['active', 'Publish'] }[r.status];
      return h('article', { class: 'card listing' },
        h('div', { class: 'ph' }, H.badge(H.label(r.status), TONE[r.status])),
        h('div', { class: 'body' },
          h('div', { class: 'eyebrow', style: { fontSize: '11px' } }, r.community || '–'),
          h('div', { class: 'h', style: { fontSize: '17px', fontWeight: 700, lineHeight: 1.3 } }, r.title),
          h('div', { class: 'muted' }, [r.bedrooms != null ? r.bedrooms + ' bed' : null, r.type ? H.label(r.type) : null, r.size_sqft ? Number(r.size_sqft).toLocaleString('en-US') + ' sq ft' : null].filter(Boolean).join(' · '))),
        h('div', { class: 'foot' }, H.bold(r.price_aed ? aed(r.price_aed) : '–'), ctx.canEdit && next ? H.rowAction(ctx, { table: 'listings', id: r.id, patch: { status: next[0] }, label: next[1] }) : h('span', { class: 'muted' }, r.ref || H.label(r.purpose))));
    })) : h('div', { class: 'card empty' }, 'No listings to show.')
  ];
});
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
